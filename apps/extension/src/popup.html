<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <style>
      /* No @import: MV3's extension CSP blocks remote stylesheets, so the old
         popup's Google Fonts line silently did nothing anyway. */
      * { box-sizing: border-box; }
      body {
        width: 300px; margin: 0; padding: 18px;
        background: #140a0d; color: #f2e8d5;
        font: 14px system-ui, "Segoe UI", sans-serif;
      }
      .brand { font-weight: 700; font-size: 18px; letter-spacing: .02em; }
      .brand span { color: #c9a227; }
      .state {
        margin: 16px 0 0; padding: 12px;
        border: 1px solid #3d1c22; border-radius: 8px; background: #2d1418;
        font-size: 13px; line-height: 1.7;
      }
      .on { border-color: rgba(201,162,39,.4); }
      .label { color: #a89684; font-size: 11px; }
      .value { color: #f2e8d5; font-weight: 600; }
      button {
        width: 100%; margin-top: 12px; padding: 9px;
        border: 1px solid rgba(214,69,69,.4); border-radius: 6px;
        background: rgba(214,69,69,.1); color: #d64545;
        font: inherit; cursor: pointer;
      }
      button:hover { background: rgba(214,69,69,.2); }
      .note {
        margin-top: 14px; padding-top: 12px; border-top: 1px solid #3d1c22;
        color: #a89684; font-size: 11px; line-height: 1.7;
      }
      a { color: #c9a227; }
    </style>
  </head>
  <body>
    <div class="brand">MS<span>Party</span></div>
    <div id="state" class="state">بنشوف...</div>
    <p class="note">
      الإضافة بتزامن التشغيل بس. مابتقراش ولا بتنقل أي صورة أو صوت من الفيديو، وكل واحد بيتفرج باشتراكه.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
